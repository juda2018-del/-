name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Creating a Pages site needs repo admin. Agents/GITHUB_TOKEN cannot
      # enable it (403). Detect first so main stays green until the owner
      # sets Settings → Pages → Source = GitHub Actions.
      - name: Detect Pages site
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled (HTTP ${code}). Owner: Settings → Pages → Source = GitHub Actions"
          fi

      - name: Skip deploy until Pages is enabled
        if: steps.pages.outputs.enabled != 'true'
        run: echo "Pages site missing — skip deploy. Production remains https://jazal.vercel.app"

      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Build
        if: steps.pages.outputs.enabled == 'true'
        run: npm ci && npm run build

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: www

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
